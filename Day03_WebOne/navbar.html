<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maithrivanam Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f7fb;
    }

    /* Custom Navbar */
    .custom-navbar {
      background: linear-gradient(90deg, #0d47a1, #00e5ff, #1976d2);
      border-radius: 20px;
      padding: 12px 20px;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .nav-link {
      font-weight: 600;
      color: white !important;
      position: relative;
      transition: 0.3s;
    }

    .nav-link:hover {
      color: #ffd700 !important;
    }

    .btn-login {
      background: white;
      color: #0d47a1;
      font-weight: 600;
      border-radius: 30px;
      padding: 6px 18px;
    }

    .btn-login:hover {
      background: #ffd700;
      color: black;
    }

    .navbar-toggler {
      border: none;
    }

    .navbar-toggler:focus {
      box-shadow: none;
    }
  </style>
</head>

<body>

  <div class="container mt-4">
    <nav class="navbar navbar-expand-lg custom-navbar shadow">
      <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand text-white" href="#">Maithrivanam Academy</a>

        <!-- Toggle Button -->
        <button class="navbar-toggler bg-white" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto gap-lg-4 text-center">
            <li class="nav-item">
              <a class="nav-link" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Classes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Navodaya</a>
            </li>
            <li class="nav-item">
              <a class="nav-link btn btn-login ms-lg-3 mt-2 mt-lg-0" href="#">
                Login
              </a>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
